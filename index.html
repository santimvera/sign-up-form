<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>my sign up form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="mainBody">
        <div class="sidebar">
            <div class="logo-box">
                <img src="./odin-lined.png" alt="Logo" class="logo-img">
                <span>ODIN</span>
            </div>
            <img src="./sidebarImage.jpg" alt="A mountain with snow" class="bg-image">
            <figcaption>Photo by Mads Schmidt Rasmussen on Unsplash</figcaption>

        </div>
        <div class="content">
            <div class="introduction">
                <div class="introduction-text">
                    <p>This is not a real online service! I am just practicing.</p>
                    <p>This form looks cool!</p>
                </div>


            </div>
            <div class="myForm">
                <form action="#" method="post">
                    <h1>Let's do it!</h1>
                    <div class="form-row">
                        <label for="first_name">First Name</label>
                        <input type="text" id="first_name" name="first_name">
                        <label for="last_name">Last Name</label>
                        <input type="text" id="last_name" name="last_name">
                    </div>
                </form>
            </div>
            <div class="actions">in here I will have the Create Account button and the login link in case the user has
                an account</div>

        </div>
    </div>

</body>

</html>
